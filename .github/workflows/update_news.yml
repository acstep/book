name: Update News Feed

on:
  schedule:
    # 每一小時自動在 GitHub 伺服器上執行一次 (UTC 時間)
    - cron: '0 * * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊立即更新
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Fetch News Script
        run: |
          python fetch_news.py

      - name: Commit and Push Updated news.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || (git commit -m "Auto-update finance news [skip ci]" && git push)

