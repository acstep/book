<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TechFinance Magazine — Flipboard Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Noto+Serif+TC:wght@400;600;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-color: #0b0c10;
  --card-bg: #14161d;
  --accent-red: #e71d36;
  --gold: #d4af37;
  --text-main: #f5f6fa;
  --text-muted: #9ba1b0;
  --font-serif: 'Noto Serif TC', 'Cinzel', serif;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: var(--bg-color);
  color: var(--text-main);
  font-family: var(--font-sans);
  touch-action: pan-y;
}

body {
  display: flex;
  flex-direction: column;
}

/* 頂部導航列 */
header {
  height: 56px;
  background: rgba(11, 12, 16, 0.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  z-index: 100;
  flex-shrink: 0;
  gap: 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.logo-badge {
  background: var(--accent-red);
  color: white;
  font-weight: 900;
  font-size: 14px;
  padding: 2px 7px;
  border-radius: 4px;
  letter-spacing: 1px;
}

.brand-title {
  font-family: 'Cinzel', serif;
  font-weight: 800;
  font-size: 16px;
  letter-spacing: 1.5px;
  color: #fff;
  white-space: nowrap;
}

.tabs-wrapper {
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
  display: flex;
  padding: 4px 0;
}

.tabs-wrapper::-webkit-scrollbar {
  display: none;
}

.tabs {
  display: flex;
  gap: 6px;
  white-space: nowrap;
}

.tab-btn {
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: var(--text-muted);
  padding: 5px 12px;
  border-radius: 18px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.tab-btn.active {
  background: #fff;
  color: #0b0c10;
  border-color: #fff;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.mode-toggle {
  display: flex;
  background: rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 2px;
}

.mode-btn {
  border: none;
  background: transparent;
  color: var(--text-muted);
  padding: 3px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}

.mode-btn.active {
  background: var(--accent-red);
  color: #fff;
}

.refresh-btn {
  background: rgba(255, 255, 255, 0.08);
  border: none;
  color: #fff;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
}

/* 3D 舞台舞台容器 */
.stage {
  flex: 1;
  width: 100%;
  position: relative;
  perspective: 2000px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px 16px;
  overflow: hidden;
}

.magazine-viewport {
  width: 100%;
  max-width: 1280px;
  height: 100%;
  position: relative;
  border-radius: 12px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
  background: var(--card-bg);
  overflow: hidden;
  touch-action: none;
}

/* 單個雜誌頁面 */
.page {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #11131a;
  display: none;
  transform-style: preserve-3d;
  backface-visibility: hidden;
}

.page.active {
  display: block;
  z-index: 10;
  transform: translate(0, 0) rotate(0deg);
  opacity: 1;
}

/* 封面故事 */
.grid-cover {
  height: 100%;
  width: 100%;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 32px 24px;
  background-size: cover;
  background-position: center;
  cursor: pointer;
}

@media (min-width: 768px) {
  .grid-cover {
    padding: 60px 80px;
  }
}

.grid-cover::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(11,12,16,0.3) 0%, rgba(11,12,16,0.94) 85%);
}

.cover-content {
  position: relative;
  z-index: 2;
  max-width: 760px;
}

.cover-tag {
  display: inline-block;
  padding: 4px 10px;
  background: var(--accent-red);
  color: #fff;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  margin-bottom: 14px;
  border-radius: 2px;
}

.cover-title {
  font-family: var(--font-serif);
  font-size: 26px;
  font-weight: 900;
  line-height: 1.3;
  color: #ffffff;
  margin-bottom: 14px;
  text-shadow: 0 2px 16px rgba(0,0,0,0.8);
}

@media (min-width: 768px) {
  .cover-title {
    font-size: 40px;
  }
}

.cover-desc {
  font-size: 14px;
  color: #d1d5db;
  line-height: 1.6;
  margin-bottom: 20px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

@media (min-width: 768px) {
  .cover-desc {
    font-size: 16px;
    -webkit-line-clamp: 4;
  }
}

/* 雜誌排版模組網格 */
.grid-bento {
  height: 100%;
  width: 100%;
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: repeat(3, 1fr);
  gap: 10px;
  padding: 10px;
  background: #0d0f15;
}

@media (min-width: 768px) {
  .grid-bento {
    grid-template-columns: 1.35fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 16px;
    padding: 16px;
  }
}

.card {
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  background-size: cover;
  background-position: center;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 18px;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.25s ease;
}

.card:hover {
  transform: translateY(-2px);
}

@media (min-width: 768px) {
  .card {
    padding: 26px;
  }
  .card-hero {
    grid-row: span 2;
    padding: 40px 32px;
  }
}

.card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(0deg, rgba(13,15,21,0.96) 0%, rgba(13,15,21,0.48) 55%, rgba(13,15,21,0.12) 100%);
}

.card-content {
  position: relative;
  z-index: 2;
}

.card-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--gold);
  margin-bottom: 6px;
}

.card-title {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 15px;
  line-height: 1.35;
  color: #fff;
  margin-bottom: 6px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

@media (min-width: 768px) {
  .card-title {
    font-size: 17px;
    -webkit-line-clamp: 3;
  }
  .card-hero .card-title {
    font-size: 24px;
  }
}

.card-desc {
  display: none;
  font-size: 13px;
  color: #c4c9d4;
  line-height: 1.5;
  margin-bottom: 12px;
}

@media (min-width: 768px) {
  .card-hero .card-desc {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  color: #8b92a4;
}

.read-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  margin-top: 8px;
}

/* 控制底列 */
.controls-bar {
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  color: var(--text-muted);
  font-size: 12px;
  flex-shrink: 0;
  background: rgba(11, 12, 16, 0.8);
}

.flip-hint {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: #717786;
}

.page-indicator {
  font-family: 'Cinzel', serif;
  letter-spacing: 1.5px;
  color: #e0e4ef;
  font-weight: 700;
}

.flip-nav {
  display: flex;
  gap: 8px;
}

.nav-arrow {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: 0.2s;
  font-size: 13px;
}

.nav-arrow:disabled {
  opacity: 0.25;
  cursor: not-allowed;
}

/* 載入動畫 */
.loading-overlay {
  position: absolute;
  inset: 0;
  background: var(--card-bg);
  z-index: 150;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  transition: opacity 0.3s ease;
}

.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid rgba(255, 255, 255, 0.1);
  border-top-color: var(--accent-red);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ============================================================
   雜誌純淨閱讀視窗 (Clean Reader Modal — 無廣告、純排版)
   ============================================================ */
.reader-modal {
  position: fixed;
  inset: 0;
  background: rgba(7, 8, 12, 0.94);
  backdrop-filter: blur(20px);
  z-index: 200;
  display: none;
  opacity: 0;
  transition: opacity 0.35s ease;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  justify-content: center;
  padding: 20px 16px 60px 16px;
}

.reader-modal.active {
/* ============================================================
   頂級雜誌內頁排版專欄 (High-End Magazine Article View)
   ============================================================ */
.reader-modal {
  position: fixed;
  inset: 0;
  background: rgba(11, 12, 16, 0.98);
  backdrop-filter: blur(25px);
  z-index: 200;
  display: none;
  opacity: 0;
  transition: opacity 0.35s ease;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  justify-content: center;
  padding: 0;
}

.reader-modal.active {
  display: flex;
  opacity: 1;
}

.reader-container {
  width: 100%;
  max-width: 860px;
  min-height: 100vh;
  background: #11131a;
  box-shadow: 0 0 80px rgba(0, 0, 0, 0.9);
  position: relative;
  display: flex;
  flex-direction: column;
}

.reader-top-bar {
  position: sticky;
  top: 0;
  background: rgba(17, 19, 26, 0.92);
  backdrop-filter: blur(15px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  z-index: 220;
}

.reader-top-brand {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 2px;
  color: var(--text-muted);
}

.reader-close-pill {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #fff;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: 0.2s;
}

.reader-close-pill:hover {
  background: var(--accent-red);
  border-color: var(--accent-red);
}

.reader-hero-wrapper {
  position: relative;
  width: 100%;
  max-height: 480px;
  overflow: hidden;
  background: #000;
}

.reader-hero-img {
  width: 100%;
  height: 100%;
  max-height: 480px;
  object-fit: cover;
  display: block;
}

.reader-hero-wrapper::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 40%, #11131a 100%);
}

.reader-body {
  padding: 20px 48px 80px 48px;
  flex: 1;
}

@media (max-width: 768px) {
  .reader-body {
    padding: 16px 20px 60px 20px;
  }
}

.reader-meta-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  background: var(--accent-red);
  color: #fff;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  border-radius: 2px;
  margin-bottom: 20px;
}

.reader-title {
  font-family: var(--font-serif);
  font-size: 36px;
  font-weight: 900;
  line-height: 1.35;
  color: #ffffff;
  margin-bottom: 20px;
  letter-spacing: -0.5px;
}

@media (max-width: 768px) {
  .reader-title {
    font-size: 24px;
  }
}

.reader-byline {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  padding: 16px 0 24px 0;
  margin-bottom: 32px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  font-size: 13px;
  color: var(--text-muted);
}

.reader-lead-paragraph {
  font-family: var(--font-serif);
  font-size: 20px;
  line-height: 1.7;
  color: #f1f3f9;
  font-weight: 600;
  margin-bottom: 28px;
  border-left: 3px solid var(--gold);
  padding-left: 18px;
}

@media (max-width: 768px) {
  .reader-lead-paragraph {
    font-size: 17px;
  }
}

.reader-content {
  font-size: 17px;
  line-height: 2.1;
  color: #c9d1df;
  letter-spacing: 0.3px;
  margin-bottom: 40px;
}

.reader-content p {
  margin-bottom: 20px;
}

.reader-footer-card {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  padding: 24px;
  margin-top: 40px;
}
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  padding-top: 20px;
  font-size: 13px;
}

.reader-orig-link {
  color: var(--gold);
  text-decoration: none;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.reader-orig-link:hover {
  text-decoration: underline;
}
</style>
</head>
<body>

<!-- 頂部欄 -->
<header>
  <div class="brand">
    <div class="logo-badge">F</div>
    <div class="brand-title">TECH INVESTOR</div>
  </div>

  <div class="tabs-wrapper">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTopic('ALL')">綜合精選</button>
      <button class="tab-btn" onclick="switchTopic('NVIDIA')">NVIDIA</button>
      <button class="tab-btn" onclick="switchTopic('INTEL')">INTEL</button>
      <button class="tab-btn" onclick="switchTopic('MICROSOFT')">MSFT</button>
      <button class="tab-btn" onclick="switchTopic('GOOGLE')">GOOGLE</button>
    </div>
  </div>

  <div class="header-right">
    <div class="mode-toggle">
      <button id="mode-h" class="mode-btn active" onclick="setFlipDirection('horizontal')">左右翻</button>
      <button id="mode-v" class="mode-btn" onclick="setFlipDirection('vertical')">上下翻</button>
    </div>

    <button class="refresh-btn" onclick="reloadNews()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
    </button>
  </div>
</header>

<!-- 雜誌舞台 -->
<div class="stage">
  <div class="magazine-viewport" id="viewport">
    <div class="loading-overlay" id="loader">
      <div class="spinner"></div>
      <div style="font-family: var(--font-serif); font-size: 13px;">正在編譯 Google RSS 財經雜誌...</div>
    </div>
  </div>
</div>

<!-- 底部控制項 -->
<div class="controls-bar">
  <div class="flip-hint" id="hint-text">
    <span>👈👉 <b>支援手勢左右滑動</b> / 鍵盤左右鍵翻頁</span>
  </div>
  <div class="page-indicator" id="page-num">PAGE 1 / 1</div>
  <div class="flip-nav">
    <button class="nav-arrow" id="prev-btn" onclick="prevPage()">◀</button>
    <button class="nav-arrow" id="next-btn" onclick="nextPage()">▶</button>
  </div>
</div>

<!-- 頂級雜誌專欄內頁閱讀器 (Editorial Magazine Reader) -->
<div class="reader-modal" id="readerModal">
  <div class="reader-container" id="readerContainer">
    <!-- 頂部吸頂導航列 -->
    <div class="reader-top-bar">
      <div class="reader-top-brand">TECH INVESTOR SPECIAL REPORT</div>
      <button class="reader-close-pill" onclick="closeReader()">✕ 返回雜誌翻頁</button>
    </div>

    <!-- 首圖大看板 -->
    <div class="reader-hero-wrapper">
      <img id="modalImg" class="reader-hero-img" src="" alt="新聞封面">
    </div>

    <!-- 雜誌內文主體 -->
    <div class="reader-body">
      <div>
        <span id="modalBadge" class="reader-meta-tag">NVIDIA · NVDA</span>
      </div>

      <h1 id="modalTitle" class="reader-title">文章標題</h1>

      <div class="reader-byline">
        <span id="modalSource" style="color:#fff; font-weight:600;">📰 來源：Yahoo Finance</span>
        <span id="modalDate">📅 2026/10/10</span>
        <span style="color:var(--gold);">★ 深度精選</span>
      </div>

      <!-- 導言引言區塊 -->
      <div id="modalLead" class="reader-lead-paragraph">
        重點摘要導讀
      </div>

      <!-- 雜誌多段落內文 -->
      <div id="modalContent" class="reader-content">
        文章內容排版
      </div>

      <!-- 底端精美資訊卡 -->
      <div class="reader-footer-card">
        <div style="font-size:12px; color:var(--gold); font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px;">
          MAGAZINE READING COMPANION
        </div>
        <p style="font-size:13px; color:#8e95a5; line-height:1.6; margin-bottom:16px;">
          本專題已透過 AI 智慧編輯室將最新外電編譯為繁體中文專欄，並徹底濾除彈跳廣告與網頁雜訊。若欲對照原始外電，可點擊下方連結。
        </p>
        <div style="display:flex; gap:12px; flex-wrap:wrap;">
          <a id="modalTranslateFullLink" class="reader-orig-link" style="background:var(--accent-red); color:#fff; padding:8px 16px; border-radius:6px; font-weight:700; text-decoration:none;" href="#" target="_blank">
            🌐 Google 繁中翻譯鏡像 ↗
          </a>
          <a id="modalOrigLink" class="reader-orig-link" style="background:rgba(255,255,255,0.08); color:#ccc; padding:8px 16px; border-radius:6px; text-decoration:none;" href="#" target="_blank">
            開啟英文原文報導 ↗
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let currentTopic = 'ALL';
let flipDirection = 'horizontal';
let allData = {};
let pages = [];
let currentPageIndex = 0;
let isFlipping = false;
let currentArticlesList = [];

// 觸控手勢變數
let touchStartX = 0;
let touchStartY = 0;
let touchEndX = 0;
let touchEndY = 0;

window.addEventListener('DOMContentLoaded', () => {
  fetchNews();
  bindTouchAndEvents();
});

function setFlipDirection(direction) {
  flipDirection = direction;
  document.getElementById('mode-h').classList.toggle('active', direction === 'horizontal');
  document.getElementById('mode-v').classList.toggle('active', direction === 'vertical');
  
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const hint = document.getElementById('hint-text');

  if (direction === 'horizontal') {
    prevBtn.innerHTML = '◀';
    nextBtn.innerHTML = '▶';
    hint.innerHTML = '<span>👈👉 <b>支援手勢左右滑動</b> / 鍵盤左右鍵翻頁</span>';
  } else {
    prevBtn.innerHTML = '▲';
    nextBtn.innerHTML = '▼';
    hint.innerHTML = '<span>👆👇 <b>支援手勢上下滑動</b> / 鍵盤上下鍵翻頁</span>';
  }
}

function switchTopic(topic) {
  if (currentTopic === topic) return;
  currentTopic = topic;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.innerText.includes(topic) || (topic === 'ALL' && b.innerText.includes('綜合')));
  });
  buildPages();
}

function reloadNews() {
  const loader = document.getElementById('loader');
  loader.style.display = 'flex';
  loader.style.opacity = '1';
  fetchNews();
}

async function fetchNews() {
  try {
    let res = null;
    try {
      res = await fetch('news.json?t=' + Date.now());
      if (!res.ok) throw new Error('news.json not found');
    } catch (e) {
      res = await fetch('/api/news');
    }
    allData = await res.json();
    buildPages();
  } catch (err) {
    console.error('Fetch error:', err);
    alert('獲取財經新聞失敗，正在自動重試...');
  } finally {
    const loader = document.getElementById('loader');
    loader.style.opacity = '0';
    setTimeout(() => { loader.style.display = 'none'; }, 300);
  }
}

function buildPages() {
  const viewport = document.getElementById('viewport');
  const loader = document.getElementById('loader');
  viewport.innerHTML = '';
  viewport.appendChild(loader);

  let articles = [];
  if (currentTopic === 'ALL') {
    const keys = ['NVIDIA', 'INTEL', 'MICROSOFT', 'GOOGLE'];
    let maxLen = Math.max(...keys.map(k => (allData[k] || []).length));
    for (let i = 0; i < maxLen; i++) {
      for (const k of keys) {
        if (allData[k] && allData[k][i]) {
          articles.push(allData[k][i]);
        }
      }
    }
  } else {
    articles = allData[currentTopic] || [];
  }

  currentArticlesList = articles;
  pages = [];

  if (articles.length === 0) {
    const emptyPage = document.createElement('div');
    emptyPage.className = 'page active';
    emptyPage.innerHTML = `<div style="height:100%; display:flex; align-items:center; justify-content:center;"><h2>暫無資料</h2></div>`;
    viewport.appendChild(emptyPage);
    updateUI();
    return;
  }

  // 封面頁
  const cover = articles[0];
  const p1 = document.createElement('div');
  p1.className = 'page';
  p1.innerHTML = `
    <div class="grid-cover" style="background-image: url('${cover.image}')" onclick="openReader(0)">
      <div class="cover-content">
        <span class="cover-tag">${cover.company} · ${cover.ticker} 特刊焦點</span>
        <h1 class="cover-title">${cover.title}</h1>
        <p class="cover-desc">${cover.description}</p>
        <div class="card-meta" style="margin-bottom: 16px;">
          <span>📰 ${cover.source}</span>
          <span>📅 ${cover.pubDate}</span>
        </div>
        <div class="cover-tag" style="background:#fff; color:#0b0c10; cursor:pointer;">
          閱讀排版專題 📖
        </div>
      </div>
    </div>
  `;
  viewport.appendChild(p1);
  pages.push(p1);

  // 雜誌分頁 (每頁 3 篇)
  let idx = 1;
  while (idx < articles.length) {
    const chunkIndices = [idx, idx + 1, idx + 2];
    const p = document.createElement('div');
    p.className = 'page';

    const h = articles[chunkIndices[0]];
    const s1 = articles[chunkIndices[1]];
    const s2 = articles[chunkIndices[2]];
    let html = `<div class="grid-bento">`;

    if (h) {
      html += `
        <div class="card card-hero" style="background-image: url('${h.image}')" onclick="openReader(${chunkIndices[0]})">
          <div class="card-content">
            <span class="card-badge">● ${h.company} (${h.ticker})</span>
            <h2 class="card-title">${h.title}</h2>
            <p class="card-desc">${h.description}</p>
            <div class="card-meta">
              <span>${h.source}</span>
              <span>${h.pubDate}</span>
            </div>
            <div class="read-btn">點擊閱讀文章 📖</div>
          </div>
        </div>
      `;
    }

    if (s1) {
      html += `
        <div class="card" style="background-image: url('${s1.image}')" onclick="openReader(${chunkIndices[1]})">
          <div class="card-content">
            <span class="card-badge">● ${s1.company}</span>
            <h3 class="card-title">${s1.title}</h3>
            <div class="card-meta">
              <span>${s1.source}</span>
            </div>
          </div>
        </div>
      `;
    }

    if (s2) {
      html += `
        <div class="card" style="background-image: url('${s2.image}')" onclick="openReader(${chunkIndices[2]})">
          <div class="card-content">
            <span class="card-badge">● ${s2.company}</span>
            <h3 class="card-title">${s2.title}</h3>
            <div class="card-meta">
              <span>${s2.source}</span>
            </div>
          </div>
        </div>
      `;
    }

    html += `</div>`;
    p.innerHTML = html;
    viewport.appendChild(p);
    pages.push(p);
    idx += 3;
  }

  currentPageIndex = 0;
  if (pages.length > 0) {
    pages[0].classList.add('active');
  }
  updateUI();
}

function updateUI() {
  const indicator = document.getElementById('page-num');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');

  const total = Math.max(1, pages.length);
  indicator.innerText = `PAGE ${currentPageIndex + 1} / ${total}`;

  prevBtn.disabled = currentPageIndex <= 0;
  nextBtn.disabled = currentPageIndex >= pages.length - 1;
}

function nextPage() {
  if (isFlipping || currentPageIndex >= pages.length - 1) return;
  isFlipping = true;

  const current = pages[currentPageIndex];
  const next = pages[currentPageIndex + 1];
  const duration = '0.62s cubic-bezier(0.645, 0.045, 0.355, 1.000)';

  if (flipDirection === 'horizontal') {
    current.style.transition = `transform ${duration}, opacity 0.62s ease`;
    current.style.transformOrigin = 'left center';
    current.style.transform = 'rotateY(-90deg) scale(0.95)';
    current.style.opacity = '0';

    next.style.display = 'block';
    next.style.transformOrigin = 'right center';
    next.style.transform = 'rotateY(90deg) scale(0.95)';
    next.style.opacity = '0';
    next.style.transition = `transform ${duration}, opacity 0.62s ease`;
  } else {
    current.style.transition = `transform ${duration}, opacity 0.62s ease`;
    current.style.transformOrigin = 'top center';
    current.style.transform = 'rotateX(-90deg) scale(0.95)';
    current.style.opacity = '0';

    next.style.display = 'block';
    next.style.transformOrigin = 'bottom center';
    next.style.transform = 'rotateX(90deg) scale(0.95)';
    next.style.opacity = '0';
    next.style.transition = `transform ${duration}, opacity 0.62s ease`;
  }

  next.offsetHeight;
  next.style.transform = 'rotateY(0deg) rotateX(0deg) scale(1)';
  next.style.opacity = '1';

  setTimeout(() => {
    current.classList.remove('active');
    current.style.display = 'none';
    current.style.transform = '';
    current.style.opacity = '';

    next.classList.add('active');
    next.style.transform = '';
    next.style.opacity = '';

    currentPageIndex++;
    updateUI();
    isFlipping = false;
  }, 620);
}

function prevPage() {
  if (isFlipping || currentPageIndex <= 0) return;
  isFlipping = true;

  const current = pages[currentPageIndex];
  const prev = pages[currentPageIndex - 1];
  const duration = '0.62s cubic-bezier(0.645, 0.045, 0.355, 1.000)';

  if (flipDirection === 'horizontal') {
    current.style.transition = `transform ${duration}, opacity 0.62s ease`;
    current.style.transformOrigin = 'right center';
    current.style.transform = 'rotateY(90deg) scale(0.95)';
    current.style.opacity = '0';

    prev.style.display = 'block';
    prev.style.transformOrigin = 'left center';
    prev.style.transform = 'rotateY(-90deg) scale(0.95)';
    prev.style.opacity = '0';
    prev.style.transition = `transform ${duration}, opacity 0.62s ease`;
  } else {
    current.style.transition = `transform ${duration}, opacity 0.62s ease`;
    current.style.transformOrigin = 'bottom center';
    current.style.transform = 'rotateX(90deg) scale(0.95)';
    current.style.opacity = '0';

    prev.style.display = 'block';
    prev.style.transformOrigin = 'top center';
    prev.style.transform = 'rotateX(-90deg) scale(0.95)';
    prev.style.opacity = '0';
    prev.style.transition = `transform ${duration}, opacity 0.62s ease`;
  }

  prev.offsetHeight;
  prev.style.transform = 'rotateY(0deg) rotateX(0deg) scale(1)';
  prev.style.opacity = '1';

  setTimeout(() => {
    current.classList.remove('active');
    current.style.display = 'none';
    current.style.transform = '';
    current.style.opacity = '';

    prev.classList.add('active');
    prev.style.transform = '';
    prev.style.opacity = '';

    currentPageIndex--;
    updateUI();
    isFlipping = false;
  }, 620);
}

// ============================================================
//  純淨閱讀器彈窗邏輯 (Clean Magazine Reader)
// ============================================================
function openReader(articleIndex) {
  const item = currentArticlesList[articleIndex];
  if (!item) return;

  document.getElementById('modalImg').src = item.image;
  document.getElementById('modalBadge').innerText = `${item.company} · ${item.ticker || ''}`;
  document.getElementById('modalTitle').innerText = item.title;
  document.getElementById('modalSource').innerText = `📰 來源媒體：${item.source}`;
  // 雜誌排版：將內文拆解成導言引句與多段落專業排版
  let fullDesc = (item.description || '').trim();
  let leadText = '';
  let bodyParagraphs = [];

  // 若內文有多句，取第一句作為金句導讀
  if (fullDesc.includes('。')) {
    let parts = fullDesc.split('。');
    leadText = parts[0] + '。';
    let rest = parts.slice(1).join('。').trim();
    if (rest) {
      bodyParagraphs = rest.split(/(?<=[！？」”\n])/).filter(p => p.trim());
    }
  } else {
    leadText = fullDesc;
  }

  document.getElementById('modalLead').innerText = leadText;

  // 產生雜誌內文段落 HTML
  let bodyHtml = '';
  if (bodyParagraphs.length > 0) {
    bodyParagraphs.forEach(p => {
      if (p.trim()) bodyHtml += `<p>${p.trim()}</p>`;
    });
  } else {
    bodyHtml = `<p>本報導深度追蹤 ${item.company} (${item.ticker}) 的最新產業生態、市值變化與全球資本市場動向。</p>`;
  }

  if (item.original_title && item.original_title !== item.title) {
    bodyHtml += `<p style="margin-top:24px; padding:14px; background:rgba(255,255,255,0.03); border-radius:6px; font-size:14px; color:#959dae;"><b>📌 華爾街原文標題：</b>${item.original_title}</p>`;
  }

  document.getElementById('modalContent').innerHTML = bodyHtml;
  document.getElementById('modalOrigLink').href = item.link;

  // 生成 Google 網頁即時全篇翻譯連結
  const translatedWebUrl = `https://translate.google.com/translate?sl=auto&tl=zh-TW&u=${encodeURIComponent(item.link)}`;
  document.getElementById('modalTranslateFullLink').href = translatedWebUrl;

  const modal = document.getElementById('readerModal');
  modal.style.display = 'flex';
  modal.offsetHeight; // reflow
  modal.classList.add('active');
  modal.scrollTop = 0;
}

function closeReader() {
  const modal = document.getElementById('readerModal');
  modal.classList.remove('active');
  setTimeout(() => {
    modal.style.display = 'none';
  }, 350);
}

function closeReaderOnBackdrop(e) {
  if (e.target.id === 'readerModal') {
    closeReader();
  }
}

// 觸控與鍵盤事件
function bindTouchAndEvents() {
  const vp = document.getElementById('viewport');

  vp.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });

  vp.addEventListener('touchend', (e) => {
    touchEndX = e.changedTouches[0].screenX;
    touchEndY = e.changedTouches[0].screenY;
    handleSwipe();
  }, { passive: true });

  window.addEventListener('keydown', (e) => {
    if (document.getElementById('readerModal').classList.contains('active')) {
      if (e.key === 'Escape') closeReader();
      return;
    }
    if (flipDirection === 'horizontal') {
      if (e.key === 'ArrowRight' || e.key === 'PageDown') nextPage();
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevPage();
    } else {
      if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') nextPage();
      if (e.key === 'ArrowUp' || e.key === 'PageUp') prevPage();
    }
  });

  let wheelDelta = 0;
  window.addEventListener('wheel', (e) => {
    if (document.getElementById('readerModal').classList.contains('active')) return;
    wheelDelta += e.deltaY;
    if (Math.abs(wheelDelta) > 40) {
      if (wheelDelta > 0) nextPage();
      else prevPage();
      wheelDelta = 0;
    }
  }, { passive: true });
}

function handleSwipe() {
  if (document.getElementById('readerModal').classList.contains('active')) return;
  const diffX = touchEndX - touchStartX;
  const diffY = touchEndY - touchStartY;
  const threshold = 40;

  if (flipDirection === 'horizontal') {
    if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > threshold) {
      if (diffX < 0) nextPage();
      else prevPage();
    }
  } else {
    if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > threshold) {
      if (diffY < 0) nextPage();
      else prevPage();
    }
  }
}
